<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE0AD" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#961910" />
      <stop offset="40%" stop-color="#D93829" />
      <stop offset="80%" stop-color="#F58220" />
      <stop offset="100%" stop-color="#FFD000" />
    </linearGradient>
    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C23" />
      <stop offset="100%" stop-color="#0E0F12" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Group Emblem -->
  <g transform="translate(10, 5)">
    <!-- Outer Decorative Ring -->
    <circle cx="50" cy="50" r="48" fill="url(#charcoalGrad)" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="50" cy="50" r="44" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="4 2" opacity="0.6" />
    
    <!-- Rising Flame Under Wok -->
    <path d="M 32 68 C 30 78, 42 84, 50 84 C 58 84, 70 78, 68 68 C 64 74, 58 76, 50 76 C 42 76, 36 74, 32 68 Z" fill="url(#fireGrad)" />
    <path d="M 40 70 C 44 80, 56 80, 60 70 C 56 75, 52 76, 50 76 C 48 76, 44 75, 40 70 Z" fill="#FFEB3B" opacity="0.8" />
    
    <!-- Wok Bowl Silhouette -->
    <path d="M 22 52 C 24 70, 76 70, 78 52 C 80 50, 74 49, 72 51 C 66 65, 34 65, 28 51 C 26 49, 20 50, 22 52 Z" fill="url(#goldGrad)" />
    
    <!-- Wok Handles -->
    <path d="M 18 48 C 16 48, 15 53, 21 54 C 21 52, 20 49, 18 48 Z" fill="url(#goldGrad)" />
    <path d="M 82 48 C 84 48, 85 53, 79 54 C 79 52, 80 49, 82 48 Z" fill="url(#goldGrad)" />

    <!-- Aromatic Steam Swirls (Stylized C & T dynamic ribbons) -->
    <path d="M 36 44 C 34 32, 44 26, 40 18 C 37 24, 30 30, 32 40 C 33 42, 35 44, 36 44 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 50 42 C 48 28, 56 22, 52 14 C 49 20, 44 26, 46 36 C 47 39, 49 42, 50 42 Z" fill="url(#goldGrad)" />
    <path d="M 64 44 C 66 32, 56 26, 60 18 C 63 24, 70 30, 68 40 C 67 42, 65 44, 64 44 Z" fill="url(#goldGrad)" opacity="0.85" />

    <!-- Crossed Golden Chopsticks -->
    <path d="M 28 20 L 72 64" stroke="#FFF0BD" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />
    <path d="M 72 20 L 28 64" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />
    
    <!-- Central Fire Pearl -->
    <circle cx="50" cy="42" r="3" fill="#D93829" />
    <circle cx="50" cy="42" r="1.5" fill="#FFF" />
  </g>

  <!-- Typography: C&T WOK -->
  <!-- "C&T" -->
  <text x="122" y="54" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" font-size="40" font-weight="800" fill="#FFFFFF" letter-spacing="2">
    C<tspan fill="url(#goldGrad)">&amp;</tspan>T
  </text>
  
  <!-- "WOK" -->
  <text x="238" y="54" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" font-size="40" font-weight="900" fill="url(#goldGrad)" letter-spacing="4">
    WOK
  </text>

  <!-- Red Accent Divider Line with Diamond Center -->
  <path d="M 124 64 L 270 64" stroke="#D93829" stroke-width="1.5" stroke-linecap="round" />
  <polygon points="278,64 282,60 286,64 282,68" fill="url(#goldGrad)" />
  <path d="M 294 64 L 440 64" stroke="#D93829" stroke-width="1.5" stroke-linecap="round" />

  <!-- Subtitle Tagline -->
  <text x="124" y="80" font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#E2E4E9" letter-spacing="3.5">
    SZECHUAN <tspan fill="url(#goldGrad)">•</tspan> CHINESE <tspan fill="url(#goldGrad)">•</tspan> THAI
  </text>

  <!-- Location & Est -->
  <text x="124" y="96" font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="9.5" font-weight="500" fill="#A0A5B5" letter-spacing="2.2">
    MORRISVILLE, NC <tspan fill="#D93829">•</tspan> EST. MORRISVILLE SQUARE
  </text>
</svg>