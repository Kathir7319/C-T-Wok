<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradEmblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE0AD" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <linearGradient id="fireGradEmblem" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#961910" />
      <stop offset="40%" stop-color="#D93829" />
      <stop offset="80%" stop-color="#F58220" />
      <stop offset="100%" stop-color="#FFD000" />
    </linearGradient>
    <linearGradient id="charcoalGradEmblem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C23" />
      <stop offset="100%" stop-color="#0E0F12" />
    </linearGradient>
  </defs>

  <!-- Outer Decorative Ring -->
  <circle cx="50" cy="50" r="48" fill="url(#charcoalGradEmblem)" stroke="url(#goldGradEmblem)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#goldGradEmblem)" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.6" />
  
  <!-- Rising Flame Under Wok -->
  <path d="M 32 68 C 30 78, 42 84, 50 84 C 58 84, 70 78, 68 68 C 64 74, 58 76, 50 76 C 42 76, 36 74, 32 68 Z" fill="url(#fireGradEmblem)" />
  <path d="M 40 70 C 44 80, 56 80, 60 70 C 56 75, 52 76, 50 76 C 48 76, 44 75, 40 70 Z" fill="#FFEB3B" opacity="0.8" />
  
  <!-- Wok Bowl Silhouette -->
  <path d="M 22 52 C 24 70, 76 70, 78 52 C 80 50, 74 49, 72 51 C 66 65, 34 65, 28 51 C 26 49, 20 50, 22 52 Z" fill="url(#goldGradEmblem)" />
  
  <!-- Wok Handles -->
  <path d="M 18 48 C 16 48, 15 53, 21 54 C 21 52, 20 49, 18 48 Z" fill="url(#goldGradEmblem)" />
  <path d="M 82 48 C 84 48, 85 53, 79 54 C 79 52, 80 49, 82 48 Z" fill="url(#goldGradEmblem)" />

  <!-- Aromatic Steam Swirls -->
  <path d="M 36 44 C 34 32, 44 26, 40 18 C 37 24, 30 30, 32 40 C 33 42, 35 44, 36 44 Z" fill="url(#goldGradEmblem)" opacity="0.85" />
  <path d="M 50 42 C 48 28, 56 22, 52 14 C 49 20, 44 26, 46 36 C 47 39, 49 42, 50 42 Z" fill="url(#goldGradEmblem)" />
  <path d="M 64 44 C 66 32, 56 26, 60 18 C 63 24, 70 30, 68 40 C 67 42, 65 44, 64 44 Z" fill="url(#goldGradEmblem)" opacity="0.85" />

  <!-- Crossed Golden Chopsticks -->
  <path d="M 28 20 L 72 64" stroke="#FFF0BD" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />
  <path d="M 72 20 L 28 64" stroke="url(#goldGradEmblem)" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />
  
  <!-- Central Fire Pearl -->
  <circle cx="50" cy="42" r="3" fill="#D93829" />
  <circle cx="50" cy="42" r="1.5" fill="#FFF" />
</svg>